name: CloudForge CI
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Préparer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Lancer les tests
        run: python -m pytest
      - name: construire l'image
        run: docker build -t cloudforge-demo:local .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'image'
          image-ref: 'cloudforge-demo:local'
          format: 'json'
          output: 'trivy-report.json'
          scanners: 'vuln'
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
      - name: Publier le rapport Trivy
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: error
  publish:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: acrcloudforgeproject26.azurecr.io/cloudforge-demo

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Connexion Azure avec OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Connexion au registre ACR
        run: az acr login --name acrcloudforgeproject26

      - name: Construire et publier l image
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"